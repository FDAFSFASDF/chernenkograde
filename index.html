<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЧЕРНЕНКОГРЕЙД</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#fff;font-family:'Inter',Arial,sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(138,43,226,.08),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(245,197,24,.05),transparent 50%);pointer-events:none;z-index:0}
.navbar{position:sticky;top:0;z-index:100;background:rgba(10,10,20,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:0 30px;display:flex;align-items:center;height:70px;gap:40px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(135deg,#8a2be2,#f5c518);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#8a2be2,#f5c518);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;-webkit-text-fill-color:#fff}
.nav-tabs{display:flex;gap:5px;flex:1;justify-content:center}
.nav-tab{padding:10px 24px;font-size:14px;font-weight:700;text-transform:uppercase;color:#666;background:0;border:none;border-radius:10px;cursor:pointer;transition:.3s;font-family:inherit}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-tab.active{color:#fff;background:linear-gradient(135deg,rgba(138,43,226,.2),rgba(245,197,24,.1));border:1px solid rgba(138,43,226,.3)}
.balance-display{padding:10px 20px;background:rgba(138,43,226,.15);border:1px solid rgba(138,43,226,.3);border-radius:10px;font-weight:800;font-size:16px;color:#f5c518;display:flex;align-items:center;gap:10px}
.code-btn{padding:6px 12px;font-size:11px;font-weight:700;background:rgba(245,197,24,.2);border:1px solid rgba(245,197,24,.4);border-radius:6px;color:#f5c518;cursor:pointer;font-family:inherit}
.page{display:none;padding:40px 30px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
.page.active{display:block}
.cases-header{text-align:center;margin-bottom:40px}
.cases-header h2{font-size:36px;font-weight:900;text-transform:uppercase;background:linear-gradient(135deg,#8a2be2,#f5c518);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cases-header p{color:#666;font-size:14px;margin-top:10px}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.case-card{background:rgba(20,20,35,.8);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:20px 16px;text-align:center;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.case-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.case-card:hover{transform:translateY(-5px);border-color:rgba(138,43,226,.3);box-shadow:0 10px 30px rgba(138,43,226,.2)}
.case-emoji{font-size:48px;margin-bottom:12px}
.case-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:6px;text-transform:uppercase;line-height:1.3}
.case-price{font-size:18px;font-weight:900;color:#f5c518}
.case-price span{font-size:12px;color:#666}
.inventory-section{margin-top:50px;padding-top:30px;border-top:1px solid rgba(255,255,255,.06)}
.inventory-section h3{font-size:20px;font-weight:800;margin-bottom:20px;text-transform:uppercase;color:#888}
.inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.inv-item{background:rgba(20,20,35,.8);border:2px solid rgba(255,255,255,.06);border-radius:12px;padding:16px 12px;text-align:center;cursor:pointer;transition:.3s}
.inv-item:hover{border-color:rgba(138,43,226,.5);transform:translateY(-3px)}
.inv-item .inv-emoji{font-size:36px;margin-bottom:8px}
.inv-item .inv-name{font-size:11px;color:#888;margin-bottom:4px}
.inv-item .inv-price{font-size:14px;color:#f5c518;font-weight:800}
.inv-actions{display:none;gap:6px;margin-top:8px;justify-content:center}
.inv-item:hover .inv-actions{display:flex}
.inv-btn{padding:4px 8px;font-size:10px;font-weight:700;border:0;border-radius:6px;cursor:pointer;font-family:inherit}
.inv-btn-sell{background:#2ecc71;color:#fff}
.inv-btn-upgrade{background:#8a2be2;color:#fff}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#12121f;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:40px;max-width:800px;width:100%;text-align:center;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal-close{position:absolute;top:15px;right:20px;background:0;border:0;color:#666;font-size:28px;cursor:pointer}
.modal h3{font-size:24px;font-weight:900;margin-bottom:8px;text-transform:uppercase}
.modal-price{color:#f5c518;font-size:20px;font-weight:800;margin-bottom:20px}
.open-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.open-btn{padding:12px 24px;font-size:14px;font-weight:800;text-transform:uppercase;border:0;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#8a2be2,#f5c518);color:#fff;transition:.3s;font-family:inherit}
.open-btn:hover{transform:translateY(-2px)}
.open-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.open-btn.small{background:rgba(138,43,226,.3);border:1px solid #8a2be2}
.roulette-container{position:relative;height:140px;overflow:hidden;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);margin-bottom:20px}
.roulette-strip{display:flex;position:absolute;top:50%;transform:translateY(-50%);transition:left 4s cubic-bezier(.15,.85,.35,1);left:0}
.roulette-item{flex-shrink:0;width:120px;height:110px;margin:0 5px;background:rgba(20,20,35,.9);border:2px solid rgba(255,255,255,.08);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.roulette-item .item-emoji{font-size:36px}
.roulette-item .item-name{font-size:11px;color:#888}
.roulette-item .item-price{font-size:14px;color:#f5c518;font-weight:800}
.roulette-pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:3px;height:100%;background:linear-gradient(180deg,#f5c518,transparent);z-index:5}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px;max-height:400px;overflow-y:auto;padding:10px}
.result-card{background:rgba(20,20,35,.8);border:2px solid rgba(255,255,255,.06);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.3s;position:relative}
.result-card.selected{border-color:#e74c3c;background:rgba(231,76,60,.1)}
.result-card .rc-emoji{font-size:32px}
.result-card .rc-name{font-size:10px;color:#888;margin:4px 0}
.result-card .rc-price{font-size:14px;color:#f5c518;font-weight:800}
.result-card .rc-check{position:absolute;top:6px;right:6px;width:20px;height:20px;background:#2ecc71;border-radius:50%;display:none;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.result-card.selected .rc-check{display:flex}
.result-card .rc-sell-label{font-size:9px;color:#e74c3c;margin-top:4px;font-weight:700}
.confirm-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.confirm-btn{padding:12px 24px;font-size:14px;font-weight:800;border:0;border-radius:10px;cursor:pointer;font-family:inherit;transition:.3s}
.confirm-btn:hover{transform:translateY(-2px)}
.btn-keep{background:rgba(46,204,113,.2);color:#2ecc71;border:1px solid #2ecc71}
.btn-sell-all{background:#e74c3c;color:#fff}
.btn-upgrade-all{background:#8a2be2;color:#fff}
.upgrader-container{display:flex;flex-direction:column;align-items:center;gap:24px;max-width:500px;margin:0 auto}
.upgrader-card{background:rgba(20,20,35,.8);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:28px;width:100%}
.upgrade-items{display:flex;gap:12px;align-items:center}
.upgrade-item-slot{flex:1;background:rgba(10,10,20,.8);border:2px dashed rgba(255,255,255,.1);border-radius:12px;padding:16px;text-align:center;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.3s}
.upgrade-item-slot:hover{border-color:rgba(138,43,226,.4)}
.upgrade-item-slot.filled{border-style:solid;border-color:rgba(138,43,226,.3)}
.slot-label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.slot-emoji{font-size:36px}
.slot-name{font-size:12px;color:#888}
.slot-price{font-size:16px;color:#f5c518;font-weight:800}
.slot-hint{font-size:11px;color:#555}
.arrow-icon{font-size:28px;color:#f5c518}
.multipliers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.mult-btn{padding:10px 16px;font-size:14px;font-weight:800;border:2px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(10,10,20,.6);color:#aaa;cursor:pointer;transition:.25s;font-family:inherit}
.mult-btn:hover{border-color:rgba(138,43,226,.4);color:#8a2be2;transform:translateY(-2px)}
.mult-btn.active{border-color:#8a2be2;color:#f5c518}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;width:100%}
.stat-box{background:rgba(10,10,20,.6);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px 12px;text-align:center}
.stat-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:900;color:#f5c518}
.stat-value.green{color:#2ecc71}
.stat-value.red{color:#e74c3c}
.bar-container{width:100%;height:8px;background:rgba(10,10,20,.8);border-radius:4px;overflow:hidden;display:flex}
.bar-win{height:100%;background:linear-gradient(90deg,#2ecc71,#27ae60);transition:.5s}
.bar-lose{height:100%;background:linear-gradient(90deg,#e74c3c,#c0392b);flex:1}
.bar-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:700}
.bar-labels .win-label{color:#2ecc71}
.bar-labels .lose-label{color:#e74c3c}
.wheel-section{position:relative;display:flex;flex-direction:column;align-items:center}
.wheel-wrapper{position:relative;width:300px;height:300px}
.wheel-outer-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#e74c3c 0deg,#e74c3c calc(180deg - var(--wh,90deg)),#2ecc71 calc(180deg - var(--wh,90deg)),#2ecc71 calc(180deg + var(--wh,90deg)),#e74c3c calc(180deg + var(--wh,90deg)),#e74c3c 360deg);padding:4px;mask:radial-gradient(circle,transparent 68%,#000 69%,#000 100%);-webkit-mask:radial-gradient(circle,transparent 68%,#000 69%,#000 100%);box-shadow:0 0 30px rgba(0,0,0,.5)}
.wheel-bg{position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1a1a2e,#0d0d18);border:1px solid rgba(255,255,255,.05)}
.ticks{position:absolute;inset:8px;border-radius:50%}
.tick{position:absolute;width:2px;height:12px;background:rgba(255,255,255,.15);top:0;left:50%;transform-origin:0 142px}
.tick.major{height:16px;width:3px;background:rgba(255,255,255,.35)}
.tick.win-tick{background:#2ecc71}
.tick.lose-tick{background:#e74c3c}
.wheel-center{position:absolute;inset:50px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1e1e32,#12121f);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.chevrons{display:flex;flex-direction:column;align-items:center;gap:2px}
.chevron{width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:20px solid #f5c518;position:relative}
.chevron::after{content:'';position:absolute;top:7px;left:-24px;width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:20px solid #1e1e32}
.center-chance{font-size:28px;font-weight:900;color:#f5c518;margin-top:4px}
.center-label{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:3px}
.arrow-orbit{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.arrow-spinner{position:absolute;top:50%;left:50%;width:0;height:0;transform-origin:0 0;transition:transform 3s cubic-bezier(.17,.67,.12,.99)}
.arrow-head{position:absolute;left:-12px;top:-145px;width:24px;height:24px}
.arrow-head svg{width:100%;height:100%}
.wheel-wrapper.win-glow .wheel-outer-ring{box-shadow:0 0 40px rgba(46,204,113,.5)}
.wheel-wrapper.lose-glow .wheel-outer-ring{box-shadow:0 0 40px rgba(231,76,60,.5)}
.upgrade-btn{padding:18px 50px;font-size:18px;font-weight:900;text-transform:uppercase;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(135deg,#8a2be2,#f5c518);color:#fff;transition:.3s;font-family:inherit;width:100%}
.upgrade-btn:hover{transform:translateY(-3px)}
.upgrade-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.result-text{font-size:20px;font-weight:900;min-height:30px;text-transform:uppercase;text-align:center}
.result-text.win{color:#2ecc71}
.result-text.lose{color:#e74c3c}
.code-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:300;align-items:center;justify-content:center;padding:20px}
.code-modal.active{display:flex}
.code-modal .modal{max-width:400px}
.code-input,.balance-input{width:100%;padding:14px 16px;background:rgba(10,10,20,.8);border:2px solid rgba(255,255,255,.08);border-radius:12px;color:#fff;font-size:20px;font-weight:800;outline:none;font-family:inherit;text-align:center;margin-bottom:16px}
.balance-input{font-size:22px;margin-bottom:20px}
.code-submit{padding:14px 40px;font-size:16px;font-weight:800;text-transform:uppercase;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#8a2be2,#f5c518);color:#fff;font-family:inherit;width:100%}
.code-error{color:#e74c3c;font-size:14px;font-weight:700;margin-top:10px;display:none}
.code-success{color:#2ecc71;font-size:14px;font-weight:700;margin-top:10px;display:none}
.item-select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;max-height:300px;overflow-y:auto;padding:10px}
.item-select-item{background:rgba(20,20,35,.8);border:2px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:.3s}
.item-select-item:hover{border-color:rgba(138,43,226,.5);transform:translateY(-2px)}
.item-select-item .sel-emoji{font-size:28px}
.item-select-item .sel-name{font-size:10px;color:#888;margin-top:4px}
.item-select-item .sel-price{font-size:12px;color:#f5c518;font-weight:800}
.summary-box{background:rgba(138,43,226,.1);border:1px solid rgba(138,43,226,.3);border-radius:12px;padding:12px;margin-bottom:15px;font-size:14px}
.summary-box span{color:#f5c518;font-weight:800}
@media(max-width:768px){.navbar{padding:0 15px;gap:15px;height:60px}.logo{font-size:16px}.logo-icon{width:30px;height:30px;font-size:16px}.nav-tab{padding:8px 14px;font-size:12px}.balance-display{padding:8px 12px;font-size:14px}.cases-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.modal{padding:24px}.wheel-wrapper{width:260px;height:260px}.tick{transform-origin:0 122px}.arrow-head{top:-125px}.wheel-center{inset:40px}.upgrade-items{flex-direction:column}.arrow-icon{transform:rotate(90deg)}}
</style>
</head>
<body>
<nav class="navbar">
<div class="logo" onclick="switchPage('cases')"><div class="logo-icon">📦</div>ЧЕРНЕНКОГРЕЙД</div>
<div class="nav-tabs">
<button class="nav-tab active" data-page="cases" onclick="switchPage('cases')">🎁 Кейсы</button>
<button class="nav-tab" data-page="upgrader" onclick="switchPage('upgrader')">⬆ Апгрейд</button>
</div>
<div class="balance-display">💰 <span id="balanceDisplay">0</span> ₽<button class="code-btn" onclick="openCodeModal()">🔑 Код</button></div>
</nav>
<div class="page active" id="page-cases">
<div class="cases-header"><h2>🎁 Открывай кейсы</h2><p>150 уникальных кейсов по фильмам и играм</p></div>
<div class="cases-grid" id="casesGrid"></div>
<div class="inventory-section" id="inventorySection" style="display:none"><h3>🎒 Инвентарь (<span id="invCount">0</span>)</h3><div class="inventory-grid" id="inventoryGrid"></div></div>
</div>
<div class="page" id="page-upgrader">
<div class="upgrader-container">
<div class="upgrader-card">
<div class="upgrade-items">
<div class="upgrade-item-slot" id="betSlot" onclick="openItemSelect('bet')"><div class="slot-label">Твой предмет</div><div class="slot-hint" id="betHint">Нажми</div><div class="slot-emoji" id="betEmoji" style="display:none"></div><div class="slot-name" id="betName" style="display:none"></div><div class="slot-price" id="betPrice" style="display:none"></div></div>
<div class="arrow-icon">➜</div>
<div class="upgrade-item-slot" id="winSlot" onclick="openItemSelect('win')"><div class="slot-label">Цель</div><div class="slot-hint" id="winHint">Нажми</div><div class="slot-emoji" id="winEmoji" style="display:none"></div><div class="slot-name" id="winName" style="display:none"></div><div class="slot-price" id="winPrice" style="display:none"></div></div>
</div>
<div class="multipliers">
<button class="mult-btn" onclick="setMult(1.5)">X1.5</button>
<button class="mult-btn" onclick="setMult(2)">X2</button>
<button class="mult-btn" onclick="setMult(3)">X3</button>
<button class="mult-btn" onclick="setMult(4)">X4</button>
<button class="mult-btn" onclick="setMult(8)">X8</button>
<button class="mult-btn" onclick="setMult(10)">X10</button>
</div>
</div>
<div class="stats">
<div class="stat-box"><div class="stat-label">Шанс</div><div class="stat-value" id="chanceDisplay">0%</div></div>
<div class="stat-box"><div class="stat-label">Множитель</div><div class="stat-value" id="multDisplay">X0.00</div></div>
<div class="stat-box"><div class="stat-label">Разница</div><div class="stat-value green" id="profitDisplay">+0</div></div>
</div>
<div style="width:100%"><div class="bar-container"><div class="bar-win" id="barWin" style="width:0%"></div><div class="bar-lose"></div></div><div class="bar-labels"><span class="win-label" id="winLabel">0%</span><span class="lose-label" id="loseLabel">100%</span></div></div>
<div class="wheel-section">
<div class="wheel-wrapper" id="wheelWrapper">
<div class="wheel-outer-ring" id="wheelRing"></div>
<div class="wheel-bg"></div>
<div class="ticks" id="ticks"></div>
<div class="wheel-center"><div class="chevrons"><div class="chevron"></div><div class="chevron"></div></div><div class="center-chance" id="centerChance">0%</div><div class="center-label">шанс</div></div>
<div class="arrow-orbit"><div class="arrow-spinner" id="arrowSpinner"><div class="arrow-head"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L12 18" stroke="#f5c518" stroke-width="2.5" stroke-linecap="round"/><path d="M6 12L12 4L18 12" stroke="#f5c518" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="20" r="3" fill="#f5c518"/></svg></div></div></div>
</div>
</div>
<button class="upgrade-btn" id="upgradeBtn" onclick="upgrade()">⬆ УЛУЧШИТЬ</button>
<div class="result-text" id="resultText"></div>
</div>
</div>
<div class="modal-overlay" id="caseModal">
<div class="modal">
<button class="modal-close" onclick="closeModal()">✕</button>
<h3 id="modalTitle">Кейс</h3>
<div class="modal-price" id="modalPrice">100 ₽</div>
<div class="open-buttons" id="openButtons">
<button class="open-btn" onclick="openCase(1)">🔓 Открыть x1</button>
<button class="open-btn small" onclick="openCase(3)">x3</button>
<button class="open-btn small" onclick="openCase(5)">x5</button>
<button class="open-btn small" onclick="openCase(10)">x10</button>
</div>
<div class="roulette-container" id="rouletteContainer" style="display:none"><div class="roulette-pointer"></div><div class="roulette-strip" id="rouletteStrip"></div></div>
<div id="resultsArea" style="display:none">
<div class="summary-box" id="summaryBox"></div>
<div class="results-grid" id="resultsGrid"></div>
<div class="confirm-buttons">
<button class="confirm-btn btn-keep" onclick="confirmResults('keep')">📦 Оставить выбранные</button>
<button class="confirm-btn btn-sell-all" onclick="confirmResults('sell')">💰 Продать выбранные</button>
<button class="confirm-btn btn-upgrade-all" onclick="confirmResults('upgrade')">⬆ В апгрейд</button>
</div>
</div>
</div>
</div>
<div class="code-modal" id="codeModal">
<div class="modal">
<button class="modal-close" onclick="closeCodeModal()">✕</button>
<h3>🔑 Ввести код</h3>

function generateCaseItems(casePrice){
const items=[];
const usedPrices=new Set();
const isCheap=casePrice<=20;
const zones=isCheap?[
{count:7,min:.25,max:.75},{count:3,min:.85,max:1.3},{count:2,min:1.6,max:2.5},{count:1,min:3.5,max:6},{count:1,min:10,max:20}
]:[
{count:9,min:.1,max:.5},{count:3,min:.6,max:1.1},{count:2,min:1.4,max:2.3},{count:1,min:3,max:5.5},{count:1,min:10,max:18}
];
for(const zone of zones){
let added=0,attempts=0;
while(added<zone.count&&attempts<80){
attempts++;
const mult=zone.min+Math.random()*(zone.max-zone.min);
let price=Math.round(casePrice*mult);
price=Math.max(2,price);
if(usedPrices.has(price))continue;
usedPrices.add(price);
const template=allItems[Math.floor(Math.random()*allItems.length)];
items.push({n:template.n,e:template.e,p:price});
added++;
}}
items.sort((a,b)=>a.p-b.p);
return items;
}

function rollOneItem(){
const roll=Math.random();
let targetMult;
if(roll<.60)targetMult=.10+Math.random()*.40;
else if(roll<.83)targetMult=.60+Math.random()*.50;
else if(roll<.94)targetMult=1.40+Math.random()*.90;
else if(roll<.99)targetMult=3.00+Math.random()*.50;
else targetMult=10.0+Math.random()*8.0;
const targetPrice=Math.round(currentCase.price*targetMult);
let best=currentCase.items[0],bestDiff=Infinity;
for(const it of currentCase.items){const d=Math.abs(it.p-targetPrice);if(d<bestDiff){bestDiff=d;best=it}}
return{...best,uid:Date.now()+Math.random()};
}
function openCase(count){

setTimeout(()=>{
pendingResults=[];
for(let i=0;i<count;i++)pendingResults.push(rollOneItem());
showResults();
},4200);
}
function showResults(){
document.getElementById('rouletteContainer').style.display='none';
document.getElementById('resultsArea').style.display='block';
selectedResults.clear();
const grid=document.getElementById('resultsGrid');
grid.innerHTML='';
let totalValue=0;
pendingResults.forEach((it,idx)=>{
totalValue+=it.p;
const d=document.createElement('div');
d.className='result-card';
d.dataset.idx=idx;
d.onclick=()=>toggleResult(idx);
d.innerHTML='<div class="rc-check">✓</div><div class="rc-emoji">'+it.e+'</div><div class="rc-name">'+it.n+'</div><div class="rc-price">'+it.p+' ₽</div><div class="rc-sell-label">Нажми чтобы продать</div>';
grid.appendChild(d);
});
const totalCost=currentCase.price*pendingResults.length;
const profit=totalValue-totalCost;
const profitSign=profit>=0?'+':'';
const profitColor=profit>=0?'#2ecc71':'#e74c3c';
document.getElementById('summaryBox').innerHTML='Открыто: <span>'+pendingResults.length+'</span> | Стоимость: <span>'+totalCost+'₽</span> | Выпало на: <span>'+totalValue+'₽</span> | Профит: <span style="color:'+profitColor+'">'+profitSign+profit+'₽</span>';
}
function toggleResult(idx){
if(selectedResults.has(idx))selectedResults.delete(idx);
else selectedResults.add(idx);
document.querySelectorAll('.result-card').forEach((c,i)=>{
if(selectedResults.has(i))c.classList.add('selected');
else c.classList.remove('selected');
});
}
function confirmResults(action){
if(selectedResults.size===0&&action!=='keep'){alert('Выбери предметы!');return}
let soldTotal=0;
const toKeep=[];
pendingResults.forEach((it,idx)=>{
if(selectedResults.has(idx)){
if(action==='sell'){soldTotal+=it.p}
else if(action==='upgrade'){toKeep.push(it)}
}else{
toKeep.push(it);
}
});
if(action==='keep'){
pendingResults.forEach(it=>inventory.push({...it,uid:Date.now()+Math.random()}));
}
if(soldTotal>0){balance+=soldTotal;updBal()}
if(toKeep.length>0){toKeep.forEach(it=>inventory.push({...it,uid:Date.now()+Math.random()}))}
renderInventory();
closeModal();
if(action==='upgrade'&&toKeep.length>0){
switchPage('upgrader');
selectedBetItem=toKeep[0];
updateUpgradeSlots();
updateUpgraderDisplay();
}
}
function renderInventory(){const sec=document.getElementById('inventorySection'),g=document.getElementById('inventoryGrid'),c=document.getElementById('invCount');if(!inventory.length){sec.style.display='none';return}sec.style.display='block';c.textContent=inventory.length;g.innerHTML='';inventory.forEach((it,i)=>{const d=document.createElement('div');d.className='inv-item';d.innerHTML='<div class="inv-emoji">'+it.e+'</div><div class="inv-name">'+it.n+'</div><div class="inv-price">'+it.p+' ₽</div><div class="inv-actions"><button class="inv-btn inv-btn-sell" onclick="event.stopPropagation();sellInv('+i+')">Продать</button><button class="inv-btn inv-btn-upgrade" onclick="event.stopPropagation();upInv('+i+')">Апгрейд</button></div>';d.onclick=()=>selForUp(i);g.appendChild(d)})}
function sellInv(i){balance+=inventory[i].p;updBal();inventory.splice(i,1);renderInventory()}
function upInv(i){selectedBetItem={...inventory[i]};switchPage('upgrader');updateUpgradeSlots();updateUpgraderDisplay()}
function selForUp(i){selectedBetItem={...inventory[i]};switchPage('upgrader');updateUpgradeSlots();updateUpgraderDisplay()}
function openItemSelect(m){itemSelectMode=m;document.getElementById('itemSelectTitle').textContent=m==='bet'?'Твой предмет':'Цель';const g=document.getElementById('itemSelectGrid');g.innerHTML='';const items=m==='bet'?inventory:allItems;if(!items.length){g.innerHTML='<p style="color:#666;grid-column:1/-1;text-align:center;padding:40px">Пусто</p>'}else{items.forEach((it,i)=>{const d=document.createElement('div');d.className='item-select-item';d.innerHTML='<div class="sel-emoji">'+it.e+'</div><div class="sel-name">'+it.n+'</div><div class="sel-price">'+it.p+' ₽</div>';d.onclick=()=>selIt(m==='bet'?i:-1,it,m);g.appendChild(d)})}document.getElementById('itemSelectModal').classList.add('active')}
function closeItemSelect(){document.getElementById('itemSelectModal').classList.remove('active')}
function selIt(i,it,m){if(m==='bet')selectedBetItem={...inventory[i]};else selectedWinItem={...it};closeItemSelect();updateUpgradeSlots();updateUpgraderDisplay()}
function updateUpgradeSlots(){const bs=document.getElementById('betSlot'),ws=document.getElementById('winSlot');if(selectedBetItem){bs.classList.add('filled');document.getElementById('betHint').style.display='none';document.getElementById('betEmoji').style.display='block';document.getElementById('betEmoji').textContent=selectedBetItem.e;document.getElementById('betName').style.display='block';document.getElementById('betName').textContent=selectedBetItem.n;document.getElementById('betPrice').style.display='block';document.getElementById('betPrice').textContent=selectedBetItem.p+' ₽'}else{bs.classList.remove('filled');document.getElementById('betHint').style.display='block';document.getElementById('betEmoji').style.display='none';document.getElementById('betName').style.display='none';document.getElementById('betPrice').style.display='none'}if(selectedWinItem){ws.classList.add('filled');document.getElementById('winHint').style.display='none';document.getElementById('winEmoji').style.display='block';document.getElementById('winEmoji').textContent=selectedWinItem.e;document.getElementById('winName').style.display='block';document.getElementById('winName').textContent=selectedWinItem.n;document.getElementById('winPrice').style.display='block';document.getElementById('winPrice').textContent=selectedWinItem.p+' ₽'}else{ws.classList.remove('filled');document.getElementById('winHint').style.display='block';document.getElementById('winEmoji').style.display='none';document.getElementById('winName').style.display='none';document.getElementById('winPrice').style.display='none'}}
for(let i=0;i<72;i++){const t=document.createElement('div');t.className='tick'+(i%6===0?' major':'');t.style.transform='rotate('+(i*5)+'deg)';document.getElementById('tC')?document.getElementById('tC').appendChild(t):document.getElementById('ticks').appendChild(t)}
function getCh(){if(!selectedBetItem||!selectedWinItem)return 0;const b=selectedBetItem.p,w=selectedWinItem.p;if(w<=0||b<=0||b>=w)return 0;return Math.min((b/w)*100*.88,95)}
function getM(){if(!selectedBetItem||!selectedWinItem)return 0;return selectedWinItem.p/selectedBetItem.p}
function updateUpgraderDisplay(){const ch=getCh(),m=getM();let pr=0;if(selectedBetItem&&selectedWinItem)pr=selectedWinItem.p-selectedBetItem.p;document.getElementById('chanceDisplay').textContent=ch.toFixed(1)+'%';document.getElementById('centerChance').textContent=ch.toFixed(1)+'%';document.getElementById('multDisplay').textContent='X'+m.toFixed(2);document.getElementById('profitDisplay').textContent=(pr>=0?'+':'')+pr.toFixed(0);document.getElementById('profitDisplay').className='stat-value '+(pr>=0?'green':'red');document.getElementById('barWin').style.width=ch+'%';document.getElementById('winLabel').textContent=ch.toFixed(1)+'% выигрыш';document.getElementById('loseLabel').textContent=(100-ch).toFixed(1)+'% проигрыш';const wd=(ch/100)*360,wh=wd/2;document.getElementById('wheelRing').style.setProperty('--wh',wh+'deg');document.querySelectorAll('.tick').forEach((t,i)=>{const a=i*5;t.classList.remove('win-tick','lose-tick');if(a>=(180-wh)&&a<=(180+wh))t.classList.add('win-tick');else t.classList.add('lose-tick')});document.querySelectorAll('.mult-btn').forEach(b=>{const bm=parseFloat(b.textContent.replace('X',''));b.classList.toggle('active',Math.abs(m-bm)<.01)});const col=ch>60?'#2ecc71':ch<20?'#e74c3c':'#f5c518';document.getElementById('chanceDisplay').style.color=col;document.getElementById('centerChance').style.color=col}
function setMult(m){if(!selectedBetItem){alert('Выбери предмет!');return}const tp=Math.round(selectedBetItem.p*m);let cl=allItems[0],md=Math.abs(allItems[0].p-tp);allItems.forEach(it=>{const d=Math.abs(it.p-tp);if(d<md){md=d;cl=it}});selectedWinItem={...cl,p:tp};updateUpgradeSlots();updateUpgraderDisplay()}
function upgrade(){if(isSpinning)return;if(!selectedBetItem||!selectedWinItem){document.getElementById('resultText').textContent='ВЫБЕРИ ПРЕДМЕТЫ';document.getElementById('resultText').className='result-text lose';return}const b=selectedBetItem.p,w=selectedWinItem.p,ch=getCh();if(b>=w){document.getElementById('resultText').textContent='ЦЕЛЬ ДОРОЖЕ!';document.getElementById('resultText').className='result-text lose';return}isSpinning=true;document.getElementById('upgradeBtn').disabled=true;document.getElementById('resultText').textContent='';document.getElementById('resultText').className='result-text';document.getElementById('wheelWrapper').classList.remove('win-glow','lose-glow');const roll=Math.random()*100,isW=roll<ch;const wd=(ch/100)*360,wh=wd/2,cm=((currentArrowRotation%360)+360)%360;let tm;if(isW){tm=180+(Math.random()-.5)*wh*1.6}else{if(Math.random()<.5){const ma=180-wh;tm=Math.random()*ma*.85+ma*.05}else{const mi=180+wh;tm=mi+Math.random()*(360-mi)*.85+(360-mi)*.05}}let dt=tm-cm;if(dt<=0)dt+=360;currentArrowRotation+=dt+(5+Math.floor(Math.random()*3))*360;document.getElementById('arrowSpinner').style.transform='rotate('+currentArrowRotation+'deg)';setTimeout(()=>{if(isW){const ii=inventory.findIndex(x=>x.uid===selectedBetItem.uid);if(ii!==-1)inventory.splice(ii,1);inventory.push({...selectedWinItem,uid:Date.now()});document.getElementById('resultText').textContent='🎉 '+selectedWinItem.n+' ПОЛУЧЕН!';document.getElementById('resultText').className='result-text win';document.getElementById('wheelWrapper').classList.add('win-glow')}else{const ii=inventory.findIndex(x=>x.uid===selectedBetItem.uid);if(ii!==-1)inventory.splice(ii,1);document.getElementById('resultText').textContent='💀 '+selectedBetItem.n+' ПОТЕРЯН';document.getElementById('resultText').className='result-text lose';document.getElementById('wheelWrapper').classList.add('lose-glow')}selectedBetItem=null;selectedWinItem=null;updateUpgradeSlots();renderInventory();isSpinning=false;document.getElementById('upgradeBtn').disabled=false;updateUpgraderDisplay()},3200)}
renderCases();updateUpgraderDisplay();
</script>
</body>
</html>
