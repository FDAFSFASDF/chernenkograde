<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЧЕРНЕНКОГРЕЙД</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #06060e;
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(ellipse at 50% 0%, rgba(245,197,24,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 0% 100%, rgba(46,204,113,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(231,76,60,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  .logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    margin-bottom: 40px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #f5c518 0%, #ff6b35 50%, #f5c518 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s ease-in-out infinite;
    text-shadow: 0 0 40px rgba(245,197,24,0.3);
    position: relative;
  }

  .logo::after {
    content: '⚡';
    position: absolute;
    right: -50px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 30px;
    -webkit-text-fill-color: #f5c518;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
    50% { opacity: 0.6; transform: translateY(-50%) scale(1.2); }
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    max-width: 420px;
    width: 100%;
    position: relative;
    z-index: 1;
  }

  /* --- Карточка ввода --- */
  .card {
    background: rgba(20, 20, 35, 0.8);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .inputs {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .input-group label {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
  }

  .input-group input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(10,10,20,0.8);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    outline: none;
    transition: all 0.3s;
    font-family: 'Inter', sans-serif;
  }

  .input-group input:focus {
    border-color: #f5c518;
    box-shadow: 0 0 20px rgba(245,197,24,0.15);
  }

  .input-group input::placeholder {
    color: #333;
  }

  .arrow-icon {
    font-size: 24px;
    color: #f5c518;
    padding-bottom: 14px;
    flex-shrink: 0;
  }

  /* --- Множители --- */
  .multipliers {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 4px;
  }

  .mult-btn {
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 800;
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    background: rgba(10,10,20,0.6);
    color: #aaa;
    cursor: pointer;
    transition: all 0.25s;
    font-family: 'Inter', sans-serif;
    letter-spacing: 1px;
  }

  .mult-btn:hover {
    border-color: rgba(245,197,24,0.4);
    color: #f5c518;
    background: rgba(245,197,24,0.05);
    transform: translateY(-2px);
  }

  .mult-btn.active {
    border-color: #f5c518;
    background: linear-gradient(135deg, rgba(245,197,24,0.15), rgba(245,166,35,0.1));
    color: #f5c518;
    box-shadow: 0 0 20px rgba(245,197,24,0.15);
  }

  /* --- Статистика --- */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .stat-box {
    background: rgba(10,10,20,0.6);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 16px 12px;
    text-align: center;
    transition: all 0.3s;
  }

  .stat-box:hover {
    border-color: rgba(255,255,255,0.12);
  }

  .stat-label {
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 900;
    color: #f5c518;
  }

  .stat-value.green { color: #2ecc71; }
  .stat-value.red { color: #e74c3c; }

  /* --- Полоса шанса --- */
  .bar-container {
    width: 100%;
    height: 8px;
    background: rgba(10,10,20,0.8);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    position: relative;
  }

  .bar-win {
    height: 100%;
    background: linear-gradient(90deg, #2ecc71, #27ae60);
    transition: width 0.5s ease;
    box-shadow: 0 0 10px rgba(46,204,113,0.3);
  }

  .bar-lose {
    height: 100%;
    background: linear-gradient(90deg, #e74c3c, #c0392b);
    flex: 1;
    box-shadow: 0 0 10px rgba(231,76,60,0.2);
  }

  .bar-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 700;
  }

  .bar-labels .win-label { color: #2ecc71; }
  .bar-labels .lose-label { color: #e74c3c; }

  /* --- Колесо --- */
  .wheel-section {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wheel-wrapper {
    position: relative;
    width: 300px;
    height: 300px;
  }

  .wheel-outer-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      #2ecc71 0deg,
      #2ecc71 var(--win-deg, 180deg),
      #e74c3c var(--win-deg, 180deg),
      #e74c3c 360deg
    );
    padding: 4px;
    mask: radial-gradient(circle, transparent 68%, #000 69%, #000 100%);
    -webkit-mask: radial-gradient(circle, transparent 68%, #000 69%, #000 100%);
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
  }

  .wheel-bg {
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #1a1a2e 0%, #0d0d18 100%);
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
  }

  /* Деления */
  .ticks {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
  }

  .tick {
    position: absolute;
    width: 2px;
    height: 12px;
    background: rgba(255,255,255,0.15);
    top: 0;
    left: 50%;
    transform-origin: 0 142px;
    border-radius: 1px;
  }

  .tick.major {
    height: 16px;
    width: 3px;
    background: rgba(255,255,255,0.35);
  }

  .tick.win-tick {
    background: rgba(46,204,113,0.4);
  }

  .tick.lose-tick {
    background: rgba(231,76,60,0.3);
  }

  /* Центр колеса */
  .wheel-center {
    position: absolute;
    inset: 50px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #1e1e32 0%, #12121f 100%);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
  }

  .chevrons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .chevron {
    width: 0; height: 0;
    border-left: 24px solid transparent;
    border-right: 24px solid transparent;
    border-bottom: 20px solid #f5c518;
    position: relative;
    filter: drop-shadow(0 0 8px rgba(245,197,24,0.4));
  }

  .chevron::after {
    content: '';
    position: absolute;
    top: 7px; left: -24px;
    width: 0; height: 0;
    border-left: 24px solid transparent;
    border-right: 24px solid transparent;
    border-bottom: 20px solid #1e1e32;
  }

  .center-chance {
    font-size: 28px;
    font-weight: 900;
    color: #f5c518;
    margin-top: 4px;
  }

  .center-label {
    font-size: 9px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 700;
  }

  /* Стрелка */
  .arrow-container {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 40px;
    z-index: 10;
  }

  .arrow {
    width: 100%;
    height: 100%;
    transform-origin: 50% 50%;
    transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    filter: drop-shadow(0 0 10px rgba(245,197,24,0.6));
  }

  .arrow svg {
    width: 100%;
    height: 100%;
  }

  /* Свечение при результате */
  .wheel-wrapper.win-glow .wheel-outer-ring {
    box-shadow: 0 0 40px rgba(46,204,113,0.4), 0 0 80px rgba(46,204,113,0.15);
  }

  .wheel-wrapper.lose-glow .wheel-outer-ring {
    box-shadow: 0 0 40px rgba(231,76,60,0.4), 0 0 80px rgba(231,76,60,0.15);
  }

  /* --- Кнопка --- */
  .upgrade-btn {
    padding: 18px 50px;
    font-size: 18px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    background: linear-gradient(135deg, #f5c518 0%, #ff8c00 100%);
    color: #000;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 8px 30px rgba(245,197,24,0.25);
    position: relative;
    overflow: hidden;
  }

  .upgrade-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
  }

  .upgrade-btn:hover::before {
    left: 100%;
  }

  .upgrade-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(245,197,24,0.4);
  }

  .upgrade-btn:active {
    transform: translateY(-1px);
  }

  .upgrade-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  .upgrade-btn:disabled::before {
    display: none;
  }

  /* --- Результат --- */
  .result {
    font-size: 20px;
    font-weight: 900;
    min-height: 30px;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-align: center;
  }

  .result.win {
    color: #2ecc71;
    text-shadow: 0 0 30px rgba(46,204,113,0.5);
    animation: resultPop 0.5s ease;
  }

  .result.lose {
    color: #e74c3c;
    text-shadow: 0 0 30px rgba(231,76,60,0.5);
    animation: resultShake 0.5s ease;
  }

  @keyframes resultPop {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes resultShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* Адаптив */
  @media (max-width: 480px) {
    .logo { font-size: 28px; letter-spacing: 4px; }
    .logo::after { right: -35px; font-size: 22px; }
    .wheel-wrapper { width: 260px; height: 260px; }
    .tick { transform-origin: 0 122px; }
    .wheel-center { inset: 40px; }
    .stat-value { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="logo">ЧЕРНЕНКОГРЕЙД</div>

<div class="container">

  <div class="card">
    <div class="inputs">
      <div class="input-group">
        <label>Ставка</label>
        <input type="number" id="betInput" value="100" min="1" placeholder="0">
      </div>
      <div class="arrow-icon">➜</div>
      <div class="input-group">
        <label>Выигрыш</label>
        <input type="number" id="winInput" value="200" min="1" placeholder="0">
      </div>
    </div>

    <div class="multipliers" style="margin-top: 16px;">
      <button class="mult-btn" onclick="setMult(1.5)">X1.5</button>
      <button class="mult-btn" onclick="setMult(2)">X2</button>
      <button class="mult-btn" onclick="setMult(3)">X3</button>
      <button class="mult-btn" onclick="setMult(4)">X4</button>
      <button class="mult-btn" onclick="setMult(8)">X8</button>
      <button class="mult-btn" onclick="setMult(10)">X10</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-label">Шанс</div>
      <div class="stat-value" id="chanceDisplay">50.0%</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Множитель</div>
      <div class="stat-value" id="multDisplay">X2.00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Профит</div>
      <div class="stat-value green" id="profitDisplay">+100</div>
    </div>
  </div>

  <div style="width:100%">
    <div class="bar-container">
      <div class="bar-win" id="barWin" style="width:50%"></div>
      <div class="bar-lose"></div>
    </div>
    <div class="bar-labels">
      <span class="win-label" id="winLabel">50.0% выигрыш</span>
      <span class="lose-label" id="loseLabel">50.0% проигрыш</span>
    </div>
  </div>

  <div class="wheel-section">
    <div class="wheel-wrapper" id="wheelWrapper">
      <div class="wheel-outer-ring" id="wheelRing"></div>
      <div class="wheel-bg"></div>
      <div class="ticks" id="ticks"></div>
      <div class="wheel-center">
        <div class="chevrons">
          <div class="chevron"></div>
          <div class="chevron"></div>
        </div>
        <div class="center-chance" id="centerChance">50.0%</div>
        <div class="center-label">шанс</div>
      </div>
      <div class="arrow-container">
        <div class="arrow" id="arrow">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M20 2 L20 28" stroke="#f5c518" stroke-width="3" stroke-linecap="round"/>
            <path d="M12 18 L20 6 L28 18" stroke="#f5c518" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="32" r="5" fill="#f5c518"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <button class="upgrade-btn" id="upgradeBtn" onclick="upgrade()">
    ⬆ УЛУЧШИТЬ
  </button>

  <div class="result" id="result"></div>

</div>

<script>
  let isSpinning = false;
  let currentArrowRotation = 0;

  const betInput = document.getElementById('betInput');
  const winInput = document.getElementById('winInput');
  const chanceDisplay = document.getElementById('chanceDisplay');
  const centerChance = document.getElementById('centerChance');
  const multDisplay = document.getElementById('multDisplay');
  const profitDisplay = document.getElementById('profitDisplay');
  const barWin = document.getElementById('barWin');
  const winLabel = document.getElementById('winLabel');
  const loseLabel = document.getElementById('loseLabel');
  const wheelRing = document.getElementById('wheelRing');
  const wheelWrapper = document.getElementById('wheelWrapper');
  const upgradeBtn = document.getElementById('upgradeBtn');
  const resultEl = document.getElementById('result');
  const ticksContainer = document.getElementById('ticks');
  const arrow = document.getElementById('arrow');
  const multBtns = document.querySelectorAll('.mult-btn');

  // Создаём деления
  for (let i = 0; i < 72; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 6 === 0 ? ' major' : '');
    tick.style.transform = `rotate(${i * 5}deg)`;
    ticksContainer.appendChild(tick);
  }

  function getChance() {
    const bet = parseFloat(betInput.value) || 0;
    const win = parseFloat(winInput.value) || 0;
    if (win <= 0 || bet <= 0) return 0;
    return Math.min((bet / win) * 100, 98);
  }

  function getMult() {
    const bet = parseFloat(betInput.value) || 0;
    const win = parseFloat(winInput.value) || 0;
    if (bet <= 0) return 0;
    return win / bet;
  }

  function updateDisplay() {
    const chance = getChance();
    const mult = getMult();
    const bet = parseFloat(betInput.value) || 0;
    const win = parseFloat(winInput.value) || 0;
    const profit = win - bet;

    chanceDisplay.textContent = chance.toFixed(1) + '%';
    centerChance.textContent = chance.toFixed(1) + '%';
    multDisplay.textContent = 'X' + mult.toFixed(2);
    profitDisplay.textContent = (profit >= 0 ? '+' : '') + profit.toFixed(0);
    profitDisplay.className = 'stat-value ' + (profit >= 0 ? 'green' : 'red');
    barWin.style.width = chance + '%';
    winLabel.textContent = chance.toFixed(1) + '% выигрыш';
    loseLabel.textContent = (100 - chance).toFixed(1) + '% проигрыш';

    const winDeg = (chance / 100) * 360;
    wheelRing.style.setProperty('--win-deg', winDeg + 'deg');

    // Обновляем цвет делений
    const ticks = ticksContainer.querySelectorAll('.tick');
    ticks.forEach((tick, i) => {
      const angle = i * 5;
      tick.classList.remove('win-tick', 'lose-tick');
      if (angle < winDeg) {
        tick.classList.add('win-tick');
      } else {
        tick.classList.add('lose-tick');
      }
    });

    multBtns.forEach(btn => {
      const btnMult = parseFloat(btn.textContent.replace('X', ''));
      btn.classList.toggle('active', Math.abs(mult - btnMult) < 0.01);
    });

    if (chance > 60) {
      chanceDisplay.style.color = '#2ecc71';
      centerChance.style.color = '#2ecc71';
    } else if (chance < 20) {
      chanceDisplay.style.color = '#e74c3c';
      centerChance.style.color = '#e74c3c';
    } else {
      chanceDisplay.style.color = '#f5c518';
      centerChance.style.color = '#f5c518';
    }
  }

  function setMult(m) {
    const bet = parseFloat(betInput.value) || 100;
    winInput.value = Math.round(bet * m * 100) / 100;
    updateDisplay();
  }

  betInput.addEventListener('input', updateDisplay);
  winInput.addEventListener('input', updateDisplay);

  function upgrade() {
    if (isSpinning) return;

    const bet = parseFloat(betInput.value) || 0;
    const win = parseFloat(winInput.value) || 0;
    const chance = getChance();

    if (bet <= 0 || win <= 0) {
      resultEl.textContent = 'ВВЕДИТЕ ЗНАЧЕНИЯ';
      resultEl.className = 'result lose';
      return;
    }
    if (bet >= win) {
      resultEl.textContent = 'ВЫИГРЫШ > СТАВКИ';
      resultEl.className = 'result lose';
      return;
    }

    isSpinning = true;
    upgradeBtn.disabled = true;
    resultEl.textContent = '';
    resultEl.className = 'result';
    wheelWrapper.classList.remove('win-glow', 'lose-glow');

    const roll = Math.random() * 100;
    const isWin = roll < chance;

    const chanceDeg = (chance / 100) * 360;
    let targetAngle;

    // Стрелка указывает вверх (0° = верх)
    // Зелёная зона: от 0° до chanceDeg (по часовой от верха)
    // Нужно чтобы стрелка остановилась в нужной зоне
    if (isWin) {
      const center = chanceDeg / 2;
      const offset = (Math.random() - 0.5) * chanceDeg * 0.6;
      targetAngle = -(center + offset); // отрицательное = против часовой (стрелка крутится)
    } else {
      const loseCenter = chanceDeg + (360 - chanceDeg) / 2;
      const loseSize = 360 - chanceDeg;
      const offset = (Math.random() - 0.5) * loseSize * 0.6;
      targetAngle = -(loseCenter + offset);
    }

    const fullSpins = 5 + Math.floor(Math.random() * 4);
    const totalRotation = currentArrowRotation + fullSpins * 360 + (targetAngle - (currentArrowRotation % 360));
    currentArrowRotation = totalRotation;

    arrow.style.transform = `rotate(${totalRotation}deg)`;

    setTimeout(() => {
      if (isWin) {
        resultEl.textContent = `🎉 ВЫИГРЫШ +${(win - bet).toFixed(0)}`;
        resultEl.className = 'result win';
        wheelWrapper.classList.add('win-glow');
      } else {
        resultEl.textContent = `💀 ПРОИГРЫШ -${bet.toFixed(0)}`;
        resultEl.className = 'result lose';
        wheelWrapper.classList.add('lose-glow');
      }

      isSpinning = false;
      upgradeBtn.disabled = false;
    }, 3200);
  }

  updateDisplay();
</script>

</body>
</html>
