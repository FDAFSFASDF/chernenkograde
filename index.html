<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЧЕРНЕНКОГРЕЙД</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#fff;font-family:'Inter',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(138,43,226,.08),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(245,197,24,.05),transparent 50%);pointer-events:none}
.navbar{position:sticky;top:0;z-index:100;background:rgba(10,10,20,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:0 30px;display:flex;align-items:center;height:70px;gap:40px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(135deg,#8a2be2,#f5c518);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#8a2be2,#f5c518);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;-webkit-text-fill-color:#fff;box-shadow:0 0 20px rgba(138,43,226,.4)}
.nav-tabs{display:flex;gap:5px;flex:1;justify-content:center}
.nav-tab{padding:10px 24px;font-size:14px;font-weight:700;text-transform:uppercase;color:#666;background:0;border:none;border-radius:10px;cursor:pointer;transition:.3s;font-family:inherit}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-tab.active{color:#fff;background:linear-gradient(135deg,rgba(138,43,226,.2),rgba(245,197,24,.1));border:1px solid rgba(138,43,226,.3)}
.balance-display{padding:10px 20px;background:rgba(138,43,226,.15);border:1px solid rgba(138,43,226,.3);border-radius:10px;font-weight:800;font-size:16px;color:#f5c518;display:flex;align-items:center;gap:10px}
.code-btn{padding:6px 12px;font-size:11px;font-weight:700;background:rgba(245,197,24,.2);border:1px solid rgba(245,197,24,.4);border-radius:6px;color:#f5c518;cursor:pointer;font-family:inherit}
.page{display:none;padding:40px 30px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
.page.active{display:block}
.cases-header{text-align:center;margin-bottom:40px}
.cases-header h2{font-size:36px;font-weight:900;text-transform:uppercase;background:linear-gradient(135deg,#8a2be2,#f5c518);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cases-header p{color:#666;font-size:14px;margin-top:10px}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.case-card{background:rgba(20,20,35,.8);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:18px 14px;text-align:center;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.case-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.case-card:hover{transform:translateY(-5px);border-color:rgba(138,43,226,.3);box-shadow:0 10px 30px rgba(138,43,226,.2)}
.case-emoji{font-size:44px;margin-bottom:10px}
.case-name{font-size:11px;font-weight:700;color:#fff;margin-bottom:6px;text-transform:uppercase;line-height:1.3;min-height:28px;display:flex;align-items:center;justify-content:center}
.case-price{font-size:17px;font-weight:900;color:#f5c518}
.case-price span{font-size:11px;color:#666}
.inventory-section{margin-top:50px;padding-top:30px;border-top:1px solid rgba(255,255,255,.06)}
.inventory-section h3{font-size:20px;font-weight:800;margin-bottom:20px;text-transform:uppercase;color:#888}
.inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.inv-item{background:rgba(20,20,35,.8);border:2px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:.3s}
.inv-item:hover{border-color:rgba(138,43,226,.5);transform:translateY(-3px);box-shadow:0 8px 20px rgba(138,43,226,.2)}
.inv-emoji{font-size:32px;margin-bottom:6px}
.inv-name{font-size:10px;color:#888;font-weight:600;margin-bottom:4px}
.inv-price{font-size:13px;color:#f5c518;font-weight:800}
.inv-actions{display:none;gap:5px;margin-top:7px;justify-content:center}
.inv-item:hover .inv-actions{display:flex}
.inv-btn{padding:4px 7px;font-size:9px;font-weight:700;border:none;border-radius:5px;cursor:pointer;font-family:inherit}
.inv-btn-sell{background:#2ecc71;color:#fff}
.inv-btn-upgrade{background:#8a2be2;color:#fff}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#12121f;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:40px;max-width:700px;width:100%;text-align:center;position:relative}
.modal-close{position:absolute;top:15px;right:20px;background:0;border:0;color:#666;font-size:28px;cursor:pointer}
.modal h3{font-size:24px;font-weight:900;margin-bottom:8px;text-transform:uppercase}
.modal-price{color:#f5c518;font-size:20px;font-weight:800;margin-bottom:30px}
.roulette-container{position:relative;height:140px;overflow:hidden;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);margin-bottom:30px}
.roulette-strip{display:flex;position:absolute;top:50%;transform:translateY(-50%);transition:left 4s cubic-bezier(.15,.85,.35,1);left:0}
.roulette-item{flex-shrink:0;width:120px;height:110px;margin:0 5px;background:rgba(20,20,35,.9);border:2px solid rgba(255,255,255,.08);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.roulette-item .item-emoji{font-size:36px}
.roulette-item .item-name{font-size:11px;color:#888}
.roulette-item .item-price{font-size:14px;color:#f5c518;font-weight:800}
.roulette-pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:3px;height:100%;background:linear-gradient(180deg,#f5c518,transparent);z-index:5}
.open-btn{padding:16px 50px;font-size:18px;font-weight:900;text-transform:uppercase;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(135deg,#8a2be2,#f5c518);color:#fff;transition:.3s;font-family:inherit}
.open-btn:hover{transform:translateY(-3px)}
.open-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.result-item{display:none;flex-direction:column;align-items:center;gap:15px;padding:30px;background:rgba(138,43,226,.1);border:2px solid rgba(138,43,226,.3);border-radius:20px;margin-bottom:20px;animation:pop .5s}
.result-item.show{display:flex}
.result-item .result-emoji{font-size:72px}
.result-item .result-name{font-size:20px;font-weight:800}
.result-item .result-price{font-size:28px;font-weight:900;color:#f5c518}
.result-actions{display:flex;gap:12px;justify-content:center}
.result-actions button{padding:12px 24px;font-size:14px;font-weight:800;text-transform:uppercase;border:0;border-radius:10px;cursor:pointer;font-family:inherit}
.btn-upgrade{background:linear-gradient(135deg,#8a2be2,#6a1fb0);color:#fff}
.btn-sell{background:rgba(46,204,113,.2);color:#2ecc71;border:1px solid #2ecc71!important}
@keyframes pop{0%{transform:scale(.5);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.upgrader-container{display:flex;flex-direction:column;align-items:center;gap:24px;max-width:500px;margin:0 auto}
.upgrader-card{background:rgba(20,20,35,.8);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:28px;width:100%}
.upgrade-items{display:flex;gap:12px;align-items:center}
.upgrade-item-slot{flex:1;background:rgba(10,10,20,.8);border:2px dashed rgba(255,255,255,.1);border-radius:12px;padding:16px;text-align:center;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.3s}
.upgrade-item-slot:hover{border-color:rgba(138,43,226,.4)}
.upgrade-item-slot.filled{border-style:solid;border-color:rgba(138,43,226,.3)}
.slot-label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.slot-emoji{font-size:36px}
.slot-name{font-size:12px;color:#888}
.slot-price{font-size:16px;color:#f5c518;font-weight:800}
.slot-hint{font-size:11px;color:#555}
.arrow-icon{font-size:28px;color:#f5c518}
.multipliers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.mult-btn{padding:10px 16px;font-size:14px;font-weight:800;border:2px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(10,10,20,.6);color:#aaa;cursor:pointer;transition:.25s;font-family:inherit}
.mult-btn:hover{border-color:rgba(138,43,226,.4);color:#8a2be2;transform:translateY(-2px)}
.mult-btn.active{border-color:#8a2be2;color:#f5c518;box-shadow:0 0 20px rgba(138,43,226,.15)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;width:100%}
.stat-box{background:rgba(10,10,20,.6);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px 12px;text-align:center}
.stat-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:900;color:#f5c518}
.stat-value.green{color:#2ecc71}
.stat-value.red{color:#e74c3c}
.bar-container{width:100%;height:8px;background:rgba(10,10,20,.8);border-radius:4px;overflow:hidden;display:flex}
.bar-win{height:100%;background:linear-gradient(90deg,#2ecc71,#27ae60);transition:.5s}
.bar-lose{height:100%;background:linear-gradient(90deg,#e74c3c,#c0392b);flex:1}
.bar-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:700}
.bar-labels .win-label{color:#2ecc71}
.bar-labels .lose-label{color:#e74c3c}
.wheel-section{position:relative;display:flex;flex-direction:column;align-items:center}
.wheel-wrapper{position:relative;width:300px;height:300px}
.wheel-outer-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#e74c3c 0deg,#e74c3c calc(180deg - var(--wh,90deg)),#2ecc71 calc(180deg - var(--wh,90deg)),#2ecc71 calc(180deg + var(--wh,90deg)),#e74c3c calc(180deg + var(--wh,90deg)),#e74c3c 360deg);padding:4px;mask:radial-gradient(circle,transparent 68%,#000 69%,#000 100%);-webkit-mask:radial-gradient(circle,transparent 68%,#000 69%,#000 100%);box-shadow:0 0 30px rgba(0,0,0,.5)}
.wheel-bg{position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1a1a2e,#0d0d18);border:1px solid rgba(255,255,255,.05)}
.ticks{position:absolute;inset:8px;border-radius:50%}
.tick{position:absolute;width:2px;height:12px;background:rgba(255,255,255,.15);top:0;left:50%;transform-origin:0 142px}
.tick.major{height:16px;width:3px;background:rgba(255,255,255,.35)}
.tick.win-tick{background:#2ecc71}
.tick.lose-tick{background:#e74c3c}
.wheel-center{position:absolute;inset:50px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1e1e32,#12121f);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.chevrons{display:flex;flex-direction:column;align-items:center;gap:2px}
.chevron{width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:20px solid #f5c518;position:relative}
.chevron::after{content:'';position:absolute;top:7px;left:-24px;width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:20px solid #1e1e32}
.center-chance{font-size:28px;font-weight:900;color:#f5c518;margin-top:4px}
.center-label{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:3px}
.arrow-orbit{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.arrow-spinner{position:absolute;top:50%;left:50%;width:0;height:0;transform-origin:0 0;transition:transform 3s cubic-bezier(.17,.67,.12,.99)}
.arrow-head{position:absolute;left:-12px;top:-145px;width:24px;height:24px}
.arrow-head svg{width:100%;height:100%}
.wheel-wrapper.win-glow .wheel-outer-ring{box-shadow:0 0 40px rgba(46,204,113,.5)}
.wheel-wrapper.lose-glow .wheel-outer-ring{box-shadow:0 0 40px rgba(231,76,60,.5)}
.upgrade-btn{padding:18px 50px;font-size:18px;font-weight:900;text-transform:uppercase;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(135deg,#8a2be2,#f5c518);color:#fff;transition:.3s;font-family:inherit;width:100%;position:relative;overflow:hidden}
.upgrade-btn:hover{transform:translateY(-3px)}
.upgrade-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.result-text{font-size:20px;font-weight:900;min-height:30px;text-transform:uppercase;text-align:center}
.result-text.win{color:#2ecc71;animation:pop .5s}
.result-text.lose{color:#e74c3c;animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.code-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);z-index:300;align-items:center;justify-content:center;padding:20px}
.code-modal.active{display:flex}
.code-modal .modal{max-width:400px}
.code-input,.balance-input{width:100%;padding:14px 16px;background:rgba(10,10,20,.8);border:2px solid rgba(255,255,255,.08);border-radius:12px;color:#fff;font-size:20px;font-weight:800;outline:none;font-family:inherit;text-align:center;margin-bottom:16px}
.balance-input{font-size:22px;margin-bottom:20px}
.code-submit{padding:14px 40px;font-size:16px;font-weight:800;text-transform:uppercase;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#8a2be2,#f5c518);color:#fff;font-family:inherit;width:100%}
.code-error{color:#e74c3c;font-size:14px;font-weight:700;margin-top:10px;display:none}
.code-success{color:#2ecc71;font-size:14px;font-weight:700;margin-top:10px;display:none}
.item-select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;max-height:300px;overflow-y:auto;padding:10px}
.item-select-item{background:rgba(20,20,35,.8);border:2px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:.3s}
.item-select-item:hover{border-color:rgba(138,43,226,.5);transform:translateY(-2px)}
.item-select-item .sel-emoji{font-size:28px}
.item-select-item .sel-name{font-size:10px;color:#888;margin-top:4px}
.item-select-item .sel-price{font-size:12px;color:#f5c518;font-weight:800}
</style>
</head>
<body>
<nav class="navbar">
<div class="logo" onclick="switchPage('cases')"><div class="logo-icon">📦</div>ЧЕРНЕНКОГРЕЙД</div>
<div class="nav-tabs">
<button class="nav-tab active" data-page="cases" onclick="switchPage('cases')">🎁 Кейсы</button>
<button class="nav-tab" data-page="upgrader" onclick="switchPage('upgrader')">⬆ Апгрейд</button>
</div>
<div class="balance-display">💰 <span id="bal">0</span> ₽ <button class="code-btn" onclick="openCode()">🔑 Код</button></div>
</nav>

<div class="page active" id="page-cases">
<div class="cases-header"><h2>🎁 Открывай кейсы</h2><p>200 уникальных кейсов по фильмам и играм</p></div>
<div class="cases-grid" id="casesGrid"></div>
<div class="inventory-section" id="invSection" style="display:none"><h3>🎒 Инвентарь (<span id="invCount">0</span>)</h3><div class="inventory-grid" id="invGrid"></div></div>
</div>

<div class="page" id="page-upgrader">
<div class="upgrader-container">
<div class="upgrader-card">
<div class="upgrade-items">
<div class="upgrade-item-slot" id="betSlot" onclick="openSelect('bet')"><div class="slot-label">Твой предмет</div><div class="slot-hint" id="betHint">Нажми</div><div class="slot-emoji" id="betE" style="display:none"></div><div class="slot-name" id="betN" style="display:none"></div><div class="slot-price" id="betP" style="display:none"></div></div>
<div class="arrow-icon">➜</div>
<div class="upgrade-item-slot" id="winSlot" onclick="openSelect('win')"><div class="slot-label">Цель</div><div class="slot-hint" id="winHint">Нажми</div><div class="slot-emoji" id="winE" style="display:none"></div><div class="slot-name" id="winN" style="display:none"></div><div class="slot-price" id="winP" style="display:none"></div></div>
</div>
<div class="multipliers">
<button class="mult-btn" onclick="setM(1.5)">X1.5</button>
<button class="mult-btn" onclick="setM(2)">X2</button>
<button class="mult-btn" onclick="setM(3)">X3</button>
<button class="mult-btn" onclick="setM(4)">X4</button>
<button class="mult-btn" onclick="setM(8)">X8</button>
<button class="mult-btn" onclick="setM(10)">X10</button>
</div>
</div>
<div class="stats">
<div class="stat-box"><div class="stat-label">Шанс</div><div class="stat-value" id="chD">0%</div></div>
<div class="stat-box"><div class="stat-label">Множитель</div><div class="stat-value" id="mD">X0</div></div>
<div class="stat-box"><div class="stat-label">Разница</div><div class="stat-value green" id="pD">+0</div></div>
</div>
<div style="width:100%"><div class="bar-container"><div class="bar-win" id="bW" style="width:0%"></div><div class="bar-lose"></div></div><div class="bar-labels"><span class="win-label" id="wL">0%</span><span class="lose-label" id="lL">100%</span></div></div>
<div class="wheel-section">
<div class="wheel-wrapper" id="wW">
<div class="wheel-outer-ring" id="wR"></div>
<div class="wheel-bg"></div>
<div class="ticks" id="tC"></div>
<div class="wheel-center"><div class="chevrons"><div class="chevron"></div><div class="chevron"></div></div><div class="center-chance" id="cC">0%</div><div class="center-label">шанс</div></div>
<div class="arrow-orbit"><div class="arrow-spinner" id="aS"><div class="arrow-head"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L12 18" stroke="#f5c518" stroke-width="2.5" stroke-linecap="round"/><path d="M6 12L12 4L18 12" stroke="#f5c518" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="20" r="3" fill="#f5c518"/></svg></div></div></div>
</div>
</div>
<button class="upgrade-btn" id="uB" onclick="doUpgrade()">⬆ УЛУЧШИТЬ</button>
<div class="result-text" id="rT"></div>
</div>
</div>

<div class="modal-overlay" id="caseModal">
<div class="modal">
<button class="modal-close" onclick="closeModal()">✕</button>
<h3 id="mT">Кейс</h3>
<div class="modal-price" id="mP">100 ₽</div>
<div class="roulette-container"><div class="roulette-pointer"></div><div class="roulette-strip" id="rS"></div></div>
<div class="result-item" id="rI"><div class="result-emoji" id="rE">🎁</div><div class="result-name" id="rN"></div><div class="result-price" id="rP"></div><div class="result-actions"><button class="btn-upgrade" onclick="upItem()">⬆ Апгрейд</button><button class="btn-sell" onclick="sellItem()">💰 Продать</button></div></div>
<button class="open-btn" id="oB" onclick="openCase()">🔓 Открыть</button>
</div>
</div>

<div class="code-modal" id="codeModal">
<div class="modal">
<button class="modal-close" onclick="closeCode()">✕</button>
<h3>🔑 Ввести код</h3>
<p style="color:#666;margin-bottom:20px;font-size:14px">Промокод для баланса</p>
<input type="text" class="code-input" id="cI" placeholder="• • • •" maxlength="10">
<div class="code-error" id="cE">❌ Неверный код!</div>
<div class="code-success" id="cS">✅ Код принят!</div>
<input type="number" class="balance-input" id="bI" placeholder="Сумма" style="display:none">
<button class="code-submit" id="cB" onclick="submitCode()">Подтвердить</button>
</div>
</div>

<div class="modal-overlay" id="selModal">
<div class="modal">
<button class="modal-close" onclick="closeSel()">✕</button>
<h3 id="selT">Выбери предмет</h3>
<div class="item-select-grid" id="selG"></div>
</div>
</div>

<script>
let bal=0,inv=[],curCase=null,lastItem=null,spinning=false,arrowRot=0,codeOk=false,betItem=null,winItem=null,selMode='bet';

const prices=[10,20,50,100,200,500,1000,2000];
function sr(s){let x=Math.sin(s)*10000;return x-Math.floor(x)}

const cases=[];
for(let i=0;i<200;i++){
const b=bases[i%bases.length];
const pv=[.85,.9,.95,1,1.05,1.1,1.15][Math.floor(sr(i*7)*7)];
const pr=Math.max(10,Math.round(prices[i%prices.length]*pv));
cases.push({id:i,name:b[0],price:pr,emoji:b[1],c1:b[2],c2:b[3],items:genItems(pr,i)});
}

function genItems(cp,cid){
const its=[];
const n=10+Math.floor(sr(cid*13)*4);
const used=new Set();
for(let i=0;i<n;i++){
const r=sr(cid*100+i*17);
let m;
if(r<.005)m=10+sr(cid*200+i)*5;
else if(r<.02)m=5+sr(cid*300+i)*3;
else if(r<.06)m=3+sr(cid*400+i)*1.5;
else if(r<.15)m=1.5+sr(cid*500+i);
else if(r<.30)m=1+sr(cid*600+i)*.4;
else m=.2+sr(cid*700+i)*.6;
const ip=Math.round(cp*m);
let idx;
do{idx=Math.floor(sr(cid*1000+i*31)*items.length)}while(used.has(idx)&&used.size<items.length);
used.add(idx);
its.push({n:items[idx].n,e:items[idx].e,p:Math.max(5,ip)});
}
its.sort((a,b)=>a.p-b.p);
return its;
}

function sellItem(){if(!lastItem)return;bal+=lastItem.p;updBal();closeModal()}
function addInv(it){inv.push({...it,uid:Date.now()+Math.random()});renderInv()}

function renderInv(){const sec=document.getElementById('invSection'),g=document.getElementById('invGrid'),c=document.getElementById('invCount');if(!inv.length){sec.style.display='none';return}sec.style.display='block';c.textContent=inv.length;g.innerHTML='';inv.forEach((it,i)=>{const d=document.createElement('div');d.className='inv-item';d.innerHTML='<div class="inv-emoji">'+it.e+'</div><div class="inv-name">'+it.n+'</div><div class="inv-price">'+it.p+' ₽</div><div class="inv-actions"><button class="inv-btn inv-btn-sell" onclick="event.stopPropagation();sellInv('+i+')">Продать</button><button class="inv-btn inv-btn-upgrade" onclick="event.stopPropagation();upInv('+i+')">Апгрейд</button></div>';d.onclick=()=>selForUp(i);g.appendChild(d)})}
function sellInv(i){bal+=inv[i].p;updBal();inv.splice(i,1);renderInv()}
function upInv(i){betItem={...inv[i]};switchPage('upgrader');updSlots();updUpg()}
function selForUp(i){betItem={...inv[i]};switchPage('upgrader');updSlots();updUpg()}

function openSelect(m){selMode=m;document.getElementById('selT').textContent=m==='bet'?'Твой предмет':'Цель';const g=document.getElementById('selG');g.innerHTML='';const its=m==='bet'?inv:items;if(!its.length){g.innerHTML='<p style="color:#666;grid-column:1/-1;text-align:center;padding:40px">Пусто</p>'}else{its.forEach((it,i)=>{const d=document.createElement('div');d.className='item-select-item';d.innerHTML='<div class="sel-emoji">'+it.e+'</div><div class="sel-name">'+it.n+'</div><div class="sel-price">'+it.p+' ₽</div>';d.onclick=()=>selIt(m==='bet'?i:-1,it,m);g.appendChild(d)})}document.getElementById('selModal').classList.add('active')}
function closeSel(){document.getElementById('selModal').classList.remove('active')}
function selIt(i,it,m){if(m==='bet')betItem={...inv[i]};else winItem={...it};closeSel();updSlots();updUpg()}

function updSlots(){const bs=document.getElementById('betSlot'),ws=document.getElementById('winSlot');if(betItem){bs.classList.add('filled');document.getElementById('betHint').style.display='none';document.getElementById('betE').style.display='block';document.getElementById('betE').textContent=betItem.e;document.getElementById('betN').style.display='block';document.getElementById('betN').textContent=betItem.n;document.getElementById('betP').style.display='block';document.getElementById('betP').textContent=betItem.p+' ₽'}else{bs.classList.remove('filled');document.getElementById('betHint').style.display='block';document.getElementById('betE').style.display='none';document.getElementById('betN').style.display='none';document.getElementById('betP').style.display='none'}if(winItem){ws.classList.add('filled');document.getElementById('winHint').style.display='none';document.getElementById('winE').style.display='block';document.getElementById('winE').textContent=winItem.e;document.getElementById('winN').style.display='block';document.getElementById('winN').textContent=winItem.n;document.getElementById('winP').style.display='block';document.getElementById('winP').textContent=winItem.p+' ₽'}else{ws.classList.remove('filled');document.getElementById('winHint').style.display='block';document.getElementById('winE').style.display='none';document.getElementById('winN').style.display='none';document.getElementById('winP').style.display='none'}}

for(let i=0;i<72;i++){const t=document.createElement('div');t.className='tick'+(i%6===0?' major':'');t.style.transform='rotate('+(i*5)+'deg)';document.getElementById('tC').appendChild(t)}

function getCh(){if(!betItem||!winItem)return 0;const b=betItem.p,w=winItem.p;if(w<=0||b<=0||b>=w)return 0;return Math.min((b/w)*100*.93,95)}
function getM(){if(!betItem||!winItem)return 0;return winItem.p/betItem.p}

function updUpg(){const ch=getCh(),m=getM();let pr=0;if(betItem&&winItem)pr=winItem.p-betItem.p;document.getElementById('chD').textContent=ch.toFixed(1)+'%';document.getElementById('cC').textContent=ch.toFixed(1)+'%';document.getElementById('mD').textContent='X'+m.toFixed(2);document.getElementById('pD').textContent=(pr>=0?'+':'')+pr.toFixed(0);document.getElementById('pD').className='stat-value '+(pr>=0?'green':'red');document.getElementById('bW').style.width=ch+'%';document.getElementById('wL').textContent=ch.toFixed(1)+'% выигрыш';document.getElementById('lL').textContent=(100-ch).toFixed(1)+'% проигрыш';const wd=(ch/100)*360,wh=wd/2;document.getElementById('wR').style.setProperty('--wh',wh+'deg');document.querySelectorAll('.tick').forEach((t,i)=>{const a=i*5;t.classList.remove('win-tick','lose-tick');if(a>=(180-wh)&&a<=(180+wh))t.classList.add('win-tick');else t.classList.add('lose-tick')});document.querySelectorAll('.mult-btn').forEach(b=>{const bm=parseFloat(b.textContent.replace('X',''));b.classList.toggle('active',Math.abs(m-bm)<.01)});const col=ch>60?'#2ecc71':ch<20?'#e74c3c':'#f5c518';document.getElementById('chD').style.color=col;document.getElementById('cC').style.color=col}

function setM(m){if(!betItem){alert('Выбери предмет!');return}const tp=Math.round(betItem.p*m);let cl=items[0],md=Math.abs(items[0].p-tp);items.forEach(it=>{const d=Math.abs(it.p-tp);if(d<md){md=d;cl=it}});winItem={...cl,p:tp};updSlots();updUpg()}

function doUpgrade(){if(spinning)return;if(!betItem||!winItem){document.getElementById('rT').textContent='ВЫБЕРИ ПРЕДМЕТЫ';document.getElementById('rT').className='result-text lose';return}const b=betItem.p,w=winItem.p,ch=getCh();if(b>=w){document.getElementById('rT').textContent='ЦЕЛЬ ДОРОЖЕ!';document.getElementById('rT').className='result-text lose';return}spinning=true;document.getElementById('uB').disabled=true;document.getElementById('rT').textContent='';document.getElementById('rT').className='result-text';document.getElementById('wW').classList.remove('win-glow','lose-glow');const roll=Math.random()*100,isW=roll<ch;const wd=(ch/100)*360,wh=wd/2,cm=((arrowRot%360)+360)%360;let tm;if(isW){tm=180+(Math.random()-.5)*wh*1.6}else{if(Math.random()<.5){const ma=180-wh;tm=Math.random()*ma*.85+ma*.05}else{const mi=180+wh;tm=mi+Math.random()*(360-mi)*.85+(360-mi)*.05}}let dt=tm-cm;if(dt<=0)dt+=360;arrowRot+=dt+(5+Math.floor(Math.random()*3))*360;document.getElementById('aS').style.transform='rotate('+arrowRot+'deg)';setTimeout(()=>{if(isW){const ii=inv.findIndex(x=>x.uid===betItem.uid);if(ii!==-1)inv.splice(ii,1);addInv({...winItem,uid:Date.now()});document.getElementById('rT').textContent='🎉 '+winItem.n+' ПОЛУЧЕН!';document.getElementById('rT').className='result-text win';document.getElementById('wW').classList.add('win-glow')}else{const ii=inv.findIndex(x=>x.uid===betItem.uid);if(ii!==-1)inv.splice(ii,1);document.getElementById('rT').textContent='💀 '+betItem.n+' ПОТЕРЯН';document.getElementById('rT').className='result-text lose';document.getElementById('wW').classList.add('lose-glow')}betItem=null;winItem=null;updSlots();renderInv();spinning=false;document.getElementById('uB').disabled=false;updUpg()},3200)}

renderCases();updUpg();
</script>
</body>
</html>
