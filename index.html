<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upgrader Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 30px;
    text-transform: uppercase;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #f5c518, #ff6b35);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    max-width: 400px;
    width: 100%;
  }

  /* --- Поля ввода --- */
  .inputs {
    display: flex;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
    min-width: 140px;
  }

  .input-group label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 16px;
    background: #1a1a2e;
    border: 2px solid #2a2a3e;
    border-radius: 10px;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    outline: none;
    transition: border-color 0.3s;
  }

  .input-group input:focus {
    border-color: #f5c518;
  }

  .arrow-between {
    font-size: 28px;
    color: #f5c518;
    margin-top: 18px;
  }

  /* --- Быстрые кнопки --- */
  .multipliers {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .mult-btn {
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 800;
    border: 2px solid #2a2a3e;
    border-radius: 8px;
    background: #1a1a2e;
    color: #f5c518;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mult-btn:hover {
    border-color: #f5c518;
    background: #2a2a1e;
    transform: scale(1.05);
  }

  .mult-btn.active {
    border-color: #f5c518;
    background: #f5c518;
    color: #000;
  }

  /* --- Инфо --- */
  .info-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 12px 16px;
    background: #1a1a2e;
    border-radius: 10px;
    border: 1px solid #2a2a3e;
  }

  .info-item {
    text-align: center;
  }

  .info-item .label {
    font-size: 10px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .info-item .value {
    font-size: 20px;
    font-weight: 800;
    color: #f5c518;
    margin-top: 2px;
  }

  .info-item .value.green { color: #2ecc71; }
  .info-item .value.red { color: #e74c3c; }

  /* --- Прогресс-бар --- */
  .chance-bar-wrapper {
    width: 100%;
    height: 10px;
    background: #1a1a2e;
    border-radius: 5px;
    overflow: hidden;
    display: flex;
  }

  .chance-bar-win {
    height: 100%;
    background: linear-gradient(90deg, #2ecc71, #27ae60);
    transition: width 0.4s;
  }

  .chance-bar-lose {
    height: 100%;
    background: linear-gradient(90deg, #e74c3c, #c0392b);
    flex: 1;
  }

  /* --- Колесо --- */
  .wheel-wrapper {
    position: relative;
    width: 320px;
    height: 320px;
  }

  .wheel-bg {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #151520;
    border: 3px solid #222;
    transition: border-color 0.5s, box-shadow 0.5s;
  }

  .wheel-ring {
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: conic-gradient(
      #2ecc71 0deg,
      #2ecc71 var(--win-deg, 120deg),
      #e74c3c var(--win-deg, 120deg),
      #e74c3c 360deg
    );
    mask: radial-gradient(circle, transparent 60%, #000 61%, #000 72%, transparent 73%);
    -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%, #000 72%, transparent 73%);
    transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }

  .wheel-inner {
    position: absolute;
    inset: 35px;
    border-radius: 50%;
    background: #111118;
    border: 1px solid #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 5px;
  }

  .chevron-up {
    width: 0; height: 0;
    border-left: 28px solid transparent;
    border-right: 28px solid transparent;
    border-bottom: 22px solid #f5c518;
    position: relative;
  }
  .chevron-up::after {
    content: '';
    position: absolute;
    top: 8px; left: -28px;
    width: 0; height: 0;
    border-left: 28px solid transparent;
    border-right: 28px solid transparent;
    border-bottom: 22px solid #111118;
  }

  .chevron-up2 {
    width: 0; height: 0;
    border-left: 28px solid transparent;
    border-right: 28px solid transparent;
    border-bottom: 22px solid #f5c518;
    position: relative;
    margin-top: -8px;
  }
  .chevron-up2::after {
    content: '';
    position: absolute;
    top: 8px; left: -28px;
    width: 0; height: 0;
    border-left: 28px solid transparent;
    border-right: 28px solid transparent;
    border-bottom: 22px solid #111118;
  }

  .chance-display {
    font-size: 30px;
    font-weight: 900;
    color: #f5c518;
    margin-top: 5px;
  }

  .chance-label {
    font-size: 10px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* Деления */
  .ticks {
    position: absolute;
    inset: 5px;
    border-radius: 50%;
  }
  .tick {
    position: absolute;
    width: 2px;
    height: 14px;
    background: rgba(255,255,255,0.3);
    top: 0;
    left: 50%;
    transform-origin: 0 155px;
  }
  .tick.major {
    height: 18px;
    width: 3px;
    background: rgba(255,255,255,0.6);
  }

  /* Указатель */
  .pointer {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 24px solid #fff;
    z-index: 10;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
  }

  /* Легенда */
  .legend {
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: #888;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .legend-dot.green { background: #2ecc71; }
  .legend-dot.red { background: #e74c3c; }

  /* --- Кнопка --- */
  .upgrade-btn {
    padding: 18px 60px;
    font-size: 20px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(135deg, #f5c518, #f5a623);
    color: #000;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    justify-content: center;
  }

  .upgrade-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 0 30px rgba(245, 197, 24, 0.4);
  }

  .upgrade-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* --- Результат --- */
  .result {
    font-size: 22px;
    font-weight: 800;
    min-height: 35px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .result.win {
    color: #2ecc71;
    text-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
  }

  .result.lose {
    color: #e74c3c;
    text-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
  }

  .wheel-wrapper.win-glow .wheel-bg {
    border-color: #2ecc71;
    box-shadow: 0 0 50px rgba(46, 204, 113, 0.4);
  }
  .wheel-wrapper.lose-glow .wheel-bg {
    border-color: #e74c3c;
    box-shadow: 0 0 50px rgba(231, 76, 60, 0.4);
  }
</style>
</head>
<body>

<h1>⚡ Upgrader</h1>

<div class="container">

  <div class="inputs">
    <div class="input-group">
      <label>Ставка</label>
      <input type="number" id="betInput" value="100" min="1">
    </div>
    <div class="arrow-between">➜</div>
    <div class="input-group">
      <label>Выигрыш</label>
      <input type="number" id="winInput" value="200" min="1">
    </div>
  </div>

  <div class="multipliers">
    <button class="mult-btn" onclick="setMult(2)">X2</button>
    <button class="mult-btn" onclick="setMult(3)">X3</button>
    <button class="mult-btn" onclick="setMult(4)">X4</button>
    <button class="mult-btn" onclick="setMult(8)">X8</button>
    <button class="mult-btn" onclick="setMult(10)">X10</button>
  </div>

  <div class="info-row">
    <div class="info-item">
      <div class="label">Шанс</div>
      <div class="value" id="chanceDisplay">50.0%</div>
    </div>
    <div class="info-item">
      <div class="label">Множитель</div>
      <div class="value" id="multDisplay">X2.00</div>
    </div>
    <div class="info-item">
      <div class="label">Профит</div>
      <div class="value green" id="profitDisplay">+100</div>
    </div>
  </div>

  <div class="chance-bar-wrapper">
    <div class="chance-bar-win" id="chanceBarWin" style="width: 50%"></div>
    <div class="chance-bar-lose"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot green"></div> Выигрыш</div>
    <div class="legend-item"><div class="legend-dot red"></div> Проигрыш</div>
  </div>

  <div class="wheel-wrapper" id="wheelWrapper">
    <div class="wheel-bg"></div>
    <div class="ticks" id="ticks"></div>
    <div class="wheel-ring" id="wheelRing"></div>
    <div class="wheel-inner">
      <div class="chevron-up"></div>
      <div class="chevron-up2"></div>
      <div class="chance-display" id="chanceDisplay2">50.0%</div>
      <div class="chance-label">шанс</div>
    </div>
    <div class="pointer"></div>
  </div>

  <button class="upgrade-btn" id="upgradeBtn" onclick="upgrade()">
    ⬆ Улучшить
  </button>

  <div class="result" id="result"></div>

</div>

<script>
  let isSpinning = false;
  let currentRotation = 0;

  const betInput = document.getElementById('betInput');
  const winInput = document.getElementById('winInput');
  const chanceDisplay = document.getElementById('chanceDisplay');
  const chanceDisplay2 = document.getElementById('chanceDisplay2');
  const multDisplay = document.getElementById('multDisplay');
  const profitDisplay = document.getElementById('profitDisplay');
  const chanceBarWin = document.getElementById('chanceBarWin');
  const wheelRing = document.getElementById('wheelRing');
  const wheelWrapper = document.getElementById('wheelWrapper');
  const upgradeBtn = document.getElementById('upgradeBtn');
  const resultEl = document.getElementById('result');
  const ticksContainer = document.getElementById('ticks');
  const multBtns = document.querySelectorAll('.mult-btn');

  // Создаём деления
  for (let i = 0; i < 72; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 6 === 0 ? ' major' : '');
    tick.style.transform = `rotate(${i * 5}deg)`;
    ticksContainer.appendChild(tick);
  }

  function getChance() {
    const bet = parseFloat(betInput.value) || 0;
    const win = parseFloat(winInput.value) || 0;
    if (win <= 0 || bet <= 0) return 0;
    return Math.min((bet / win) * 100, 98);
  }

  function getMult() {
    const bet = parseFloat(betInput.value) || 0;
    const win = parseFloat(winInput.value) || 0;
    if (bet <= 0) return 0;
    return win / bet;
  }

  function updateDisplay() {
    const chance = getChance();
    const mult = getMult();
    const bet = parseFloat(betInput.value) || 0;
    const win = parseFloat(winInput.value) || 0;
    const profit = win - bet;

    chanceDisplay.textContent = chance.toFixed(1) + '%';
    chanceDisplay2.textContent = chance.toFixed(1) + '%';
    multDisplay.textContent = 'X' + mult.toFixed(2);
    profitDisplay.textContent = (profit >= 0 ? '+' : '') + profit.toFixed(0);
    profitDisplay.className = 'value ' + (profit >= 0 ? 'green' : 'red');
    chanceBarWin.style.width = chance + '%';

    // Обновляем кольцо
    const winDeg = (chance / 100) * 360;
    wheelRing.style.setProperty('--win-deg', winDeg + 'deg');

    // Подсветка активной кнопки множителя
    multBtns.forEach(btn => {
      const btnMult = parseFloat(btn.textContent.replace('X', ''));
      btn.classList.toggle('active', Math.abs(mult - btnMult) < 0.01);
    });

    // Цвет шанса
    if (chance > 60) {
      chanceDisplay.style.color = '#2ecc71';
      chanceDisplay2.style.color = '#2ecc71';
    } else if (chance < 20) {
      chanceDisplay.style.color = '#e74c3c';
      chanceDisplay2.style.color = '#e74c3c';
    } else {
      chanceDisplay.style.color = '#f5c518';
      chanceDisplay2.style.color = '#f5c518';
    }
  }

  function setMult(m) {
    const bet = parseFloat(betInput.value) || 100;
    winInput.value = Math.round(bet * m);
    updateDisplay();
  }

  betInput.addEventListener('input', updateDisplay);
  winInput.addEventListener('input', updateDisplay);

  function upgrade() {
    if (isSpinning) return;

    const bet = parseFloat(betInput.value) || 0;
    const win = parseFloat(winInput.value) || 0;
    const chance = getChance();

    if (bet <= 0 || win <= 0) {
      resultEl.textContent = 'Введите значения!';
      resultEl.className = 'result lose';
      return;
    }
    if (bet >= win) {
      resultEl.textContent = 'Выигрыш > ставки!';
      resultEl.className = 'result lose';
      return;
    }

    isSpinning = true;
    upgradeBtn.disabled = true;
    resultEl.textContent = '';
    resultEl.className = 'result';
    wheelWrapper.classList.remove('win-glow', 'lose-glow');

    const roll = Math.random() * 100;
    const isWin = roll < chance;

    const chanceDeg = (chance / 100) * 360;
    let targetAngle;

    if (isWin) {
      const winZoneCenter = chanceDeg / 2;
      const offset = (Math.random() - 0.5) * chanceDeg * 0.7;
      targetAngle = 180 - winZoneCenter - offset;
    } else {
      const loseZoneStart = chanceDeg;
      const loseZoneEnd = 360;
      const loseZoneCenter = (loseZoneStart + loseZoneEnd) / 2;
      const loseZoneSize = loseZoneEnd - loseZoneStart;
      const offset = (Math.random() - 0.5) * loseZoneSize * 0.7;
      targetAngle = 180 - loseZoneCenter - offset;
    }

    const fullSpins = 5 + Math.floor(Math.random() * 3);
    const totalRotation = currentRotation + fullSpins * 360 + (targetAngle - (currentRotation % 360));
    currentRotation = totalRotation;

    wheelRing.style.transform = `rotate(${totalRotation}deg)`;

    setTimeout(() => {
      if (isWin) {
        resultEl.textContent = `🎉 ВЫИГРЫШ! +${(win - bet).toFixed(0)}`;
        resultEl.className = 'result win';
        wheelWrapper.classList.add('win-glow');
      } else {
        resultEl.textContent = `💀 ПРОИГРЫШ! -${bet.toFixed(0)}`;
        resultEl.className = 'result lose';
        wheelWrapper.classList.add('lose-glow');
      }

      isSpinning = false;
      upgradeBtn.disabled = false;
    }, 3200);
  }

  updateDisplay();
</script>

</body>
</html>
